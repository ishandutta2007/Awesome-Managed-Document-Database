<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 320" width="100%" height="100%">
  <defs>
    <!-- Dark Tech Gradients -->
    <linearGradient id="bg-gradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#080C14" />
      <stop offset="50%" stop-color="#0F172A" />
      <stop offset="100%" stop-color="#1E1035" />
    </linearGradient>

    <linearGradient id="title-gradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38BDF8" />
      <stop offset="50%" stop-color="#818CF8" />
      <stop offset="100%" stop-color="#C084FC" />
    </linearGradient>

    <linearGradient id="card-glow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8" stop-opacity="0.15" />
      <stop offset="100%" stop-color="#C084FC" stop-opacity="0.05" />
    </linearGradient>

    <linearGradient id="line-gradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38BDF8" stop-opacity="0.8" />
      <stop offset="50%" stop-color="#A855F7" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#F43F5E" stop-opacity="0.2" />
    </linearGradient>

    <!-- Filters for Glow Effect -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
    <filter id="soft-shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="6" flood-color="#000000" flood-opacity="0.5" />
    </filter>
  </defs>

  <style>
    @keyframes pulse-glow {
      0%, 100% { opacity: 0.3; transform: scale(1); }
      50% { opacity: 0.7; transform: scale(1.05); }
    }
    @keyframes flow-line {
      0% { stroke-dashoffset: 1000; }
      100% { stroke-dashoffset: 0; }
    }
    @keyframes float-node {
      0%, 100% { transform: translateY(0px); }
      50% { transform: translateY(-8px); }
    }
    @keyframes float-node-reverse {
      0%, 100% { transform: translateY(0px); }
      50% { transform: translateY(8px); }
    }
    @keyframes rotate-ring {
      from { transform: rotate(0deg); }
      to { transform: rotate(360deg); }
    }

    .bg { fill: url(#bg-gradient); }
    .glow-orb-1 { animation: pulse-glow 6s ease-in-out infinite; transform-origin: 200px 100px; }
    .glow-orb-2 { animation: pulse-glow 8s ease-in-out infinite 2s; transform-origin: 1000px 220px; }
    .animated-line {
      stroke-dasharray: 20, 10;
      animation: flow-line 25s linear infinite;
    }
    .node-group-1 { animation: float-node 5s ease-in-out infinite; }
    .node-group-2 { animation: float-node-reverse 6s ease-in-out infinite 1s; }
    .ring-rotate { animation: rotate-ring 20s linear infinite; transform-origin: 1060px 160px; }
    
    .title-text {
      font-family: system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      font-weight: 800;
      font-size: 46px;
      fill: url(#title-gradient);
      letter-spacing: -0.5px;
    }
    .subtitle-text {
      font-family: system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      font-weight: 400;
      font-size: 19px;
      fill: #E2E8F0;
      letter-spacing: 0.2px;
    }
    .badge-text {
      font-family: system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      font-weight: 600;
      font-size: 13px;
      fill: #38BDF8;
    }
  </style>

  <!-- Background -->
  <rect width="1200" height="320" class="bg" rx="16" />

  <!-- Background Dynamic Orbs (Glow Background) -->
  <circle cx="200" cy="80" r="160" fill="#38BDF8" opacity="0.15" class="glow-orb-1" filter="url(#glow)" />
  <circle cx="1020" cy="240" r="180" fill="#A855F7" opacity="0.2" class="glow-orb-2" filter="url(#glow)" />

  <!-- Geometric Grid & Data Flow Lines (Dynamic Layer - Background) -->
  <g opacity="0.25">
    <path d="M 0 100 Q 300 40 600 160 T 1200 120" fill="none" stroke="url(#line-gradient)" stroke-width="2" class="animated-line" />
    <path d="M 0 220 Q 400 280 800 180 T 1200 240" fill="none" stroke="url(#line-gradient)" stroke-width="1.5" class="animated-line" />
    
    <!-- Document DB Abstract Wireframes / Dynamic Nodes -->
    <g class="node-group-1">
      <rect x="900" y="60" width="70" height="85" rx="8" fill="url(#card-glow)" stroke="#38BDF8" stroke-width="1.5" stroke-dasharray="4 2" />
      <path d="M 915 80 H 955 M 915 95 H 945 M 915 110 H 950" stroke="#38BDF8" stroke-width="2" stroke-linecap="round" />
    </g>
    <g class="node-group-2">
      <rect x="1010" y="130" width="80" height="95" rx="8" fill="url(#card-glow)" stroke="#C084FC" stroke-width="1.5" />
      <path d="M 1025 155 H 1075 M 1025 172 H 1060 M 1025 189 H 1070" stroke="#C084FC" stroke-width="2" stroke-linecap="round" />
    </g>
    <!-- Rotating Accent Ring -->
    <circle cx="1060" cy="160" r="110" fill="none" stroke="#A855F7" stroke-width="1" stroke-dasharray="8 12" class="ring-rotate" opacity="0.4" />
  </g>

  <!-- Foreground Layer: Title, Subtitle, Badges (Guaranteed Unobscured) -->
  <g filter="url(#soft-shadow)">
    <!-- Top Pill Badge -->
    <g transform="translate(60, 48)">
      <rect width="210" height="30" rx="15" fill="#0F172A" stroke="#38BDF8" stroke-width="1.2" opacity="0.9" />
      <circle cx="16" cy="15" r="4" fill="#38BDF8" />
      <text x="30" y="20" class="badge-text">MANAGED DOCUMENT DB</text>
    </g>

    <!-- Main Title -->
    <text x="60" y="132" class="title-text">Awesome Managed Document Database</text>

    <!-- Subtitle -->
    <text x="60" y="176" class="subtitle-text">Curated SaaS Platforms, Self-Hosted NoSQL &amp; Open-Source Document Stores</text>

    <!-- Category Pills -->
    <g transform="translate(60, 218)">
      <!-- Pill 1 -->
      <g transform="translate(0, 0)">
        <rect width="145" height="36" rx="8" fill="#1E293B" stroke="#334155" stroke-width="1" />
        <text x="16" y="23" font-family="system-ui" font-size="13" font-weight="600" fill="#94A3B8">☁️ Managed SaaS</text>
      </g>
      <!-- Pill 2 -->
      <g transform="translate(157, 0)">
        <rect width="165" height="36" rx="8" fill="#1E293B" stroke="#334155" stroke-width="1" />
        <text x="16" y="23" font-family="system-ui" font-size="13" font-weight="600" fill="#94A3B8">🔓 Open-Source Engines</text>
      </g>
      <!-- Pill 3 -->
      <g transform="translate(334, 0)">
        <rect width="165" height="36" rx="8" fill="#1E293B" stroke="#334155" stroke-width="1" />
        <text x="16" y="23" font-family="system-ui" font-size="13" font-weight="600" fill="#94A3B8">⚡ Realtime &amp; Sync</text>
      </g>
      <!-- Pill 4 -->
      <g transform="translate(511, 0)">
        <rect width="150" height="36" rx="8" fill="#1E293B" stroke="#334155" stroke-width="1" />
        <text x="16" y="23" font-family="system-ui" font-size="13" font-weight="600" fill="#94A3B8">🎯 NoSQL &amp; BaaS</text>
      </g>
    </g>
  </g>
</svg>
